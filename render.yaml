# Render Blueprint — the whole app from one repo connection.
#
# On Render: New → Blueprint → connect this GitHub repo. Render reads this file and
# provisions the database, the API, and the static frontend together. Every push to the
# connected branch then redeploys automatically — that is the "change it later" guarantee.
databases:
  - name: campus-wallet-db
    plan: free            # free Postgres; expires after 90 days, recreate then
    databaseName: campus_wallet
    user: wallet

services:
  # ---- API (Express) ----
  - type: web
    name: campus-wallet-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci
    # Migrations are forward-only and recorded, so re-running on every boot is a no-op —
    # safe rather than a deploy-time gamble.
    #
    # `--if-empty` is load-bearing. The seed TRUNCATES, and a free instance sleeps after
    # ~15 minutes idle: an unguarded seed would wipe the database on every cold start, so
    # any account created while someone was looking at the demo would be gone by the time
    # they came back. With the guard it seeds once, on first boot, and never again.
    #
    # For a real PUC pilot, drop the seed entirely — see DEPLOY.md §A.3.
    startCommand: npm run migrate && npm run seed -- --if-empty && npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret; never commit one
      - key: DATABASE_URL
        fromDatabase:                # wired straight from the database above — no copy-paste
          name: campus-wallet-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:                 # the frontend's own URL, filled in automatically
          type: web
          name: campus-wallet-web
          property: url
      - key: PUBLIC_APP_URL
        fromService:
          type: web
          name: campus-wallet-web
          property: url
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: campus-wallet-api
          property: url
      - key: BCRYPT_ROUNDS
        value: "12"
      # WALLET_MODE is deliberately NOT set. It defaults to zero_float, the only lawful
      # mode: the university never holds student balances (Payment and Settlement Systems
      # Act 2024 s.15(1)). Setting it to closed_loop here would make the API refuse to
      # start, because NODE_ENV is production above — that refusal is the point, not a bug
      # to work around. See README "The zero-float rule" and PUC-HANDOVER.md §2.

  # ---- Frontend (static React) ----
  - type: web
    name: campus-wallet-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The API's real URL, filled in by Render at build time.
      #
      # This replaced a rewrite whose destination was a hardcoded hostname. Render appends
      # a random suffix to free-tier service names, so that hostname was wrong on every
      # fresh deploy and the site came up looking fine while every request 404'd — a
      # manual post-deploy edit that is easy to forget and hard to diagnose.
      #
      # Going cross-origin is safe here because the API's CORS_ORIGINS is wired from this
      # service's URL by the same mechanism, so the two cannot disagree.
      - key: VITE_API_BASE
        fromService:
          type: web
          name: campus-wallet-api
          property: url
    # SPA fallback: every non-asset path serves index.html so client-side routes work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
