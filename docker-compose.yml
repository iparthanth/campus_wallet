services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: campus_wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The api must not start against a half-open database, so compose waits on this.
      test: ["CMD-SHELL", "pg_isready -U wallet -d campus_wallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://wallet:wallet@db:5432/campus_wallet
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-in-production-min32}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate && npm start"

volumes:
  pgdata:
