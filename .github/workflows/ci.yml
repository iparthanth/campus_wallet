name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock. The concurrency tests are meaningless without one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          # Tests refuse to run against anything not ending in _test (see tests/helpers.js).
          POSTGRES_DB: campus_wallet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wallet -d campus_wallet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://wallet:wallet@localhost:5432/campus_wallet_test
      JWT_SECRET: ci-test-secret-not-used-in-production-min32
      BCRYPT_ROUNDS: 4   # keep CI fast; production uses 12

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
        working-directory: api

      - run: npm run migrate
        working-directory: api

      - run: npm run test:cov
        working-directory: api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: api/coverage/

  e2e:
    runs-on: ubuntu-latest
    needs: api-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: campus_wallet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wallet -d campus_wallet"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # Both configurations get driven in a real browser, because they are genuinely
    # different applications. Production is zero_float: no balance, no transfers, no
    # top-up. closed_loop is the demo. When the balance was removed from the student
    # screen, every E2E test failed on getByTestId('balance') — the suite only knew how
    # to drive the demo, and nothing had ever exercised what actually ships.
    strategy:
      fail-fast: false
      matrix:
        mode: [zero_float, closed_loop]

    env:
      DATABASE_URL: postgres://wallet:wallet@localhost:5432/campus_wallet
      JWT_SECRET: ci-test-secret-not-used-in-production-min32
      BCRYPT_ROUNDS: 4
      CI: 'true'
      # Read at import time by config.js, so it must be set before the API starts.
      WALLET_MODE: ${{ matrix.mode }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Install and migrate API
        working-directory: api
        run: npm ci && npm run migrate

      # The zero-float specs drive a real counter, which needs an acquirer-onboarded
      # outlet — an administrative state no code path creates. The seed establishes it.
      - name: Seed demo outlets
        working-directory: api
        run: npm run seed

      - name: Start API
        working-directory: api
        run: npm start &

      - name: Install web
        working-directory: web
        run: npm ci

      - name: Install E2E + browser
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      # The API is backgrounded, so wait for it to actually serve before Playwright
      # hits it — otherwise the first request races the server's boot and flakes.
      # /ready runs a real DB query, so a 200 here means the whole stack is up.
      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ready > /dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in 30s"; exit 1

      - name: Run E2E (${{ matrix.mode }})
        working-directory: e2e
        # Specs are split by directory because a test written for one mode cannot pass in
        # the other: one asserts a balance exists, the other asserts it does not.
        run: npx playwright test tests/${{ matrix.mode == 'zero_float' && 'zero-float' || 'closed-loop' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.mode }}
          path: e2e/playwright-report/
